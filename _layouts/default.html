<html lang="en">

<style>
/* ==========================================================================
   Design tokens
   ========================================================================== */

:root {
  --font-serif: "Newsreader", Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif;
  --font-mono:  "IBM Plex Mono", ui-monospace, "SF Mono", "Cascadia Code", Menlo, monospace;
  --font-sans:  "IBM Plex Sans", system-ui, -apple-system, sans-serif;

  --fs-micro:   0.6875rem;
  --fs-mono:    0.75rem;
  --fs-meta:    0.8125rem;
  --fs-sm:      0.9375rem;
  --fs-base:    1.1875rem;
  --fs-lead:    1.375rem;
  --fs-h3:      1.5rem;
  --fs-h2:      1.9375rem;
  --fs-h1:      2.75rem;
  --fs-display: 3.5rem;

  --lh-tight: 1.18;
  --lh-snug:  1.35;
  --lh-body:  1.72;
  --lh-meta:  1.5;

  color-scheme: light;
  --paper:       oklch(0.988 0.004 40);
  --paper-sunk:  oklch(0.968 0.006 40);
  --paper-raise: oklch(0.998 0.002 40);
  --ink:         oklch(0.248 0.014 35);
  --ink-soft:    oklch(0.398 0.012 35);
  --ink-mute:    oklch(0.540 0.010 30);
  --ink-faint:   oklch(0.660 0.008 30);
  --rule:        oklch(0.888 0.008 40);
  --rule-soft:   oklch(0.928 0.005 40);
  --accent:      oklch(0.405 0.135 22);
  --accent-deep: oklch(0.335 0.130 22);
  --accent-tint: oklch(0.958 0.024 22);
  --accent-rule: oklch(0.698 0.090 22);

  --space-1: 0.25rem; --space-2: 0.5rem;  --space-3: 0.75rem;
  --space-4: 1rem;    --space-5: 1.5rem;  --space-6: 2rem;
  --space-7: 3rem;    --space-8: 4.5rem;  --space-9: 7rem;

  --measure: 62ch;
  --measure-wide: 74ch;
  --page-pad: clamp(1.25rem, 5vw, 3rem);
  --radius: 3px;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  --dur: 180ms;
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --paper:       oklch(0.188 0.013 30);
  --paper-sunk:  oklch(0.228 0.015 30);
  --paper-raise: oklch(0.218 0.014 30);
  --ink:         oklch(0.930 0.009 40);
  --ink-soft:    oklch(0.778 0.011 40);
  --ink-mute:    oklch(0.622 0.012 30);
  --ink-faint:   oklch(0.502 0.012 30);
  --rule:        oklch(0.322 0.018 30);
  --rule-soft:   oklch(0.272 0.015 30);
  --accent:      oklch(0.740 0.150 20);
  --accent-deep: oklch(0.810 0.130 20);
  --accent-tint: oklch(0.295 0.048 22);
  --accent-rule: oklch(0.520 0.100 22);
}

*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--font-serif);
  font-size: var(--fs-base);
  line-height: var(--lh-body);
  color: var(--ink);
  background: var(--paper);
  transition: background-color 240ms var(--ease), color 240ms var(--ease);
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern" 1, "liga" 1, "onum" 1;
}

::selection { background: var(--accent-tint); color: var(--ink); }
a { color: var(--accent); text-decoration: none; }
p { text-wrap: pretty; }

.visually-hidden {
  position: absolute; width: 1px; height: 1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap;
}

.shell {
  width: 100%;
  max-width: calc(var(--measure) + var(--page-pad) * 2);
  margin-inline: auto;
  padding-inline: var(--page-pad);
}

.kicker {
  font-family: var(--font-mono);
  font-size: var(--fs-mono);
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-mute);
  font-weight: 500;
}

/* Header */
.site-head {
  border-bottom: 1px solid var(--rule);
  background: color-mix(in oklch, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.1) blur(6px);
  position: sticky; top: 0; z-index: 20;
}
.site-head__row {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--space-5); padding-block: var(--space-4);
}
.wordmark {
  display: inline-flex; align-items: baseline; gap: 0.45ch;
  color: var(--ink); font-weight: 500;
  font-size: 1.35rem; letter-spacing: -0.01em; text-decoration: none;
}
.site-head__right { display: flex; align-items: center; gap: var(--space-5); }
.theme-toggle {
  flex: none; width: 30px; height: 30px; padding: 0; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 1px solid var(--rule); border-radius: 50%;
  transition: border-color var(--dur) var(--ease);
}
.theme-toggle:hover { border-color: var(--ink-mute); }
.theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.theme-toggle__disc {
  width: 14px; height: 14px; border-radius: 50%;
  border: 1.5px solid var(--ink-mute);
  background: linear-gradient(90deg, var(--ink-soft) 0 50%, transparent 50% 100%);
}
.nav {
  display: flex; align-items: center; gap: var(--space-5);
  font-family: var(--font-mono); font-size: var(--fs-micro);
  letter-spacing: 0.16em; text-transform: uppercase;
}
.nav a {
  color: var(--ink-faint); text-decoration: none;
  padding-bottom: 2px; border-bottom: 1px solid transparent;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.nav a:hover { color: var(--ink); border-bottom-color: var(--rule); }
.nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }

/* Masthead */
.masthead { padding-top: var(--space-8); }
.masthead__eyebrow { margin-bottom: var(--space-5); }
.masthead__title {
  font-size: clamp(2.65rem, 6.4vw, 3.7rem);
  line-height: 1.02; font-weight: 560; letter-spacing: -0.022em;
  color: var(--ink); max-width: 16ch; text-wrap: balance;
}
.masthead__deck {
  margin-top: var(--space-4); position: relative; padding-top: var(--space-4);
  font-size: clamp(1.3rem, 2.5vw, 1.6rem);
  line-height: 1.36; font-weight: 400; letter-spacing: -0.006em;
  color: var(--ink-soft); max-width: 40ch; text-wrap: balance;
}
.masthead__deck::before {
  content: ""; position: absolute; top: 0; left: 0;
  width: 3.5ch; height: 2px; background: var(--accent); border-radius: 2px;
}
.masthead__byline {
  margin-top: var(--space-6);
  font-family: var(--font-mono); font-size: var(--fs-meta);
  color: var(--ink-mute); letter-spacing: 0.02em;
}
.title-seam { color: var(--accent); }

/* Prose */
.prose > * + * { margin-top: var(--space-5); }
.prose p { font-size: var(--fs-base); line-height: var(--lh-body); }
.prose em { font-style: italic; }
.prose strong { font-weight: 600; }
.prose a {
  text-decoration: underline; text-decoration-thickness: 1px;
  text-underline-offset: 0.18em; text-decoration-color: var(--accent-rule);
  transition: text-decoration-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.prose a:hover { color: var(--accent-deep); text-decoration-color: var(--accent); }

.rule-mark {
  border: 0; height: 0; border-top: 1px solid var(--rule);
  width: 4ch; margin-block: var(--space-7); margin-inline: 0;
}

/* Epistemic callout */
.epistemic {
  --es-pad: clamp(1.1rem, 3vw, 1.75rem);
  border-top: 1px solid var(--rule);
  padding-block: var(--es-pad);
}
.epistemic__label {
  display: flex; align-items: center; gap: 0.7ch;
  font-family: var(--font-mono); font-size: var(--fs-mono);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent-deep); font-weight: 600; margin-bottom: var(--space-4);
}
.epistemic__label::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex: none;
}
.epistemic__fields {
  display: grid; grid-template-columns: max-content 1fr;
  gap: var(--space-2) var(--space-4);
  font-family: var(--font-mono); font-size: var(--fs-meta);
  line-height: var(--lh-meta);
  padding-bottom: var(--space-4); margin-bottom: var(--space-4);
  border-bottom: 1px solid var(--rule);
}
.epistemic__fields dt {
  color: var(--ink-faint); text-transform: uppercase;
  letter-spacing: 0.08em; font-size: var(--fs-micro); font-weight: 500; padding-top: 0.25em;
}
.epistemic__fields dd { color: var(--ink); }
.epistemic__note { font-size: var(--fs-sm); line-height: 1.6; color: var(--ink-soft); }
.epistemic__note em { font-style: italic; color: var(--ink-mute); }

/* Tags */
.tag {
  font-family: var(--font-mono); font-size: var(--fs-micro);
  letter-spacing: 0.03em; color: var(--ink-mute);
  border: 1px solid var(--rule-soft); border-radius: 3px;
  padding: 0.1rem 0.45rem; background: transparent;
  transition: color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.tag::before { content: "#"; color: var(--ink-faint); }
.tag:hover { color: var(--ink); border-color: var(--ink-faint); }

/* Footer */
.site-foot {
  margin-top: var(--space-9);
  border-top: 1px solid var(--rule);
  padding-block: var(--space-6) var(--space-8);
}
.site-foot__row {
  display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-5);
  align-items: baseline; justify-content: space-between;
  font-family: var(--font-mono); font-size: var(--fs-mono);
  color: var(--ink-mute); letter-spacing: 0.03em;
}

/* Section anatomy */
.page-section {
  padding-top: var(--space-9);
  padding-bottom: var(--space-8);
}
.section-head { margin-bottom: var(--space-7); }
.section-head h2 {
  font-family: var(--font-serif);
  font-size: clamp(1.85rem, 4vw, var(--fs-h2));
  font-weight: 560;
  line-height: var(--lh-tight);
  letter-spacing: -0.018em;
  color: var(--ink);
  max-width: 26ch;
  text-wrap: balance;
  margin-top: var(--space-3);
}
.section-lede {
  margin-top: var(--space-3);
  font-family: var(--font-serif);
  font-style: italic;
  color: var(--ink-soft);
  font-size: var(--fs-lead);
  line-height: 1.45;
  max-width: 44ch;
  text-wrap: pretty;
}

/* Practice list */
.practice-list { list-style: none; padding: 0; margin: 0; }
.practice-item {
  display: flex; gap: var(--space-5);
  padding-block: var(--space-4);
  border-top: 1px solid var(--rule);
  align-items: baseline;
}
.practice-item:last-child { border-bottom: 1px solid var(--rule); }
.practice-num {
  font-family: var(--font-mono); font-size: var(--fs-mono);
  color: var(--accent); flex-shrink: 0; width: 1.6rem;
  letter-spacing: 0.04em; font-weight: 500;
}
.practice-text {
  font-family: var(--font-serif); font-size: var(--fs-base);
  color: var(--ink); line-height: var(--lh-snug); text-wrap: pretty;
}

/* Project entries */
.project-list { list-style: none; padding: 0; margin: 0; }
.project {
  display: grid; grid-template-columns: 2.5rem 1fr;
  gap: 0 var(--space-4);
  padding-block: var(--space-7);
  border-top: 1px solid var(--rule);
}
.project__num {
  font-family: var(--font-mono); font-size: var(--fs-micro);
  color: var(--accent); letter-spacing: 0.08em;
  padding-top: 0.4em; font-weight: 600;
}
.project__name {
  font-family: var(--font-serif); font-size: var(--fs-h3);
  font-weight: 500; color: var(--ink);
  letter-spacing: -0.012em; line-height: 1.15; margin-bottom: var(--space-2);
}
.project__meta {
  font-family: var(--font-mono); font-size: var(--fs-meta);
  color: var(--ink-mute); letter-spacing: 0.02em;
  margin-bottom: var(--space-4);
  display: flex; flex-wrap: wrap; gap: 0 0.5ch; align-items: baseline;
}
.project__meta .org { color: var(--ink-soft); }
.project__meta .sep { color: var(--rule); margin-inline: 0.3ch; }
.project__oneliner {
  font-family: var(--font-serif); font-style: italic;
  font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.55;
  padding-left: var(--space-4); border-left: 1.5px solid var(--accent-rule);
  margin-block: var(--space-4); text-wrap: pretty;
}
.project__body {
  font-family: var(--font-serif); font-size: var(--fs-sm);
  color: var(--ink-soft); line-height: var(--lh-body);
  text-wrap: pretty; margin-bottom: var(--space-4);
}
.project__tags { display: flex; flex-wrap: wrap; gap: var(--space-2); }

/* Career table */
.career-list { list-style: none; padding: 0; margin: 0; }
.career-row {
  display: grid; grid-template-columns: 8.5rem 1fr 5rem;
  gap: var(--space-3); padding-block: var(--space-3);
  border-top: 1px solid var(--rule-soft); align-items: baseline;
}
.career-years {
  font-family: var(--font-mono); font-size: var(--fs-meta);
  color: var(--ink-mute); letter-spacing: 0.02em; white-space: nowrap;
}
.career-role {
  font-family: var(--font-serif); font-size: 1rem;
  color: var(--ink); line-height: 1.4; text-wrap: pretty;
}
.career-org { font-style: italic; color: var(--ink-soft); }
.career-org::before { content: " \B7 "; font-style: normal; color: var(--ink-faint); }
.career-where {
  font-family: var(--font-mono); font-size: var(--fs-micro);
  color: var(--ink-faint); letter-spacing: 0.04em;
  text-align: right; white-space: nowrap;
}

/* Contact grid */
.contact-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
  margin-top: var(--space-6);
}
.contact-cell {
  padding: var(--space-5) 0; text-decoration: none; color: var(--ink);
  border-right: 1px solid var(--rule); padding-right: var(--space-5);
  transition: color var(--dur) var(--ease);
}
.contact-cell + .contact-cell { padding-left: var(--space-5); }
.contact-cell:last-child { border-right: 0; }
.contact-cell:hover .contact-val { color: var(--accent); }
.contact-label {
  font-family: var(--font-mono); font-size: var(--fs-micro);
  color: var(--accent); letter-spacing: 0.12em;
  text-transform: uppercase; margin-bottom: var(--space-2); font-weight: 500;
}
.contact-val {
  font-family: var(--font-serif); font-size: var(--fs-lead);
  color: var(--ink); line-height: 1.2; letter-spacing: -0.01em;
  transition: color var(--dur) var(--ease);
}

/* Intro prose */
.intro-prose > p + p { margin-top: var(--space-5); }
.intro-prose > p { max-width: var(--measure); text-wrap: pretty; }

/* Responsive */
@media (max-width: 640px) {
  .masthead { padding-top: var(--space-5); }
  .masthead__eyebrow { margin-bottom: var(--space-3); }
  .site-head__right { gap: var(--space-3); }
  .nav { display: none; }
  .masthead__title { font-size: clamp(1.85rem, 8vw, 2.6rem); overflow-wrap: break-word; }
  .career-row { grid-template-columns: max-content 1fr; }
  .career-where { display: none; }
  .project { grid-template-columns: 1.75rem 1fr; gap: 0 var(--space-3); }
  .contact-grid { grid-template-columns: 1fr; }
  .contact-cell {
    border-right: 0; border-bottom: 1px solid var(--rule);
    padding-left: 0 !important; padding-right: 0 !important;
  }
  .contact-cell:last-child { border-bottom: 0; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}
</style>
<script>
/* Theme: light default, opt-in dark, persisted */
(function () {
  var KEY = "rossouw-theme";
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem(KEY);
    if (saved === "dark") root.setAttribute("data-theme", "dark");
    else if (saved === "light") root.removeAttribute("data-theme");
  } catch (e) {}
  function current() { return root.getAttribute("data-theme") === "dark" ? "dark" : "light"; }
  function apply(theme) {
    if (theme === "dark") root.setAttribute("data-theme", "dark");
    else root.removeAttribute("data-theme");
    try { localStorage.setItem(KEY, theme); } catch (e) {}
    sync();
  }
  function sync() {
    var t = current();
    var btns = document.querySelectorAll("[data-theme-toggle]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", t === "light" ? "true" : "false");
      btns[i].setAttribute("aria-label", t === "light" ? "Switch to dark theme" : "Switch to light theme");
    }
  }
  document.addEventListener("DOMContentLoaded", function () {
    var btns = document.querySelectorAll("[data-theme-toggle]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () { apply(current() === "light" ? "dark" : "light"); });
    }
    sync();
  });
})();
</script>
</head>

<a class="visually-hidden" href="#intro">Skip to main content</a>

<header class="site-head">
  <div class="shell site-head__row">
    <a class="wordmark" href="#intro" aria-label="Adrian Rossouw — home">Adrian Rossouw</a>
    <div class="site-head__right">
      <nav class="nav" aria-label="Primary">
        <a href="#practice">Practice</a>
        <a href="#work">Work</a>
        <a href="#career">Career</a>
        <a href="#contact">Contact</a>
      </nav>
      <button class="theme-toggle" data-theme-toggle aria-label="Switch to dark theme">
        <span class="theme-toggle__disc" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>

{{ content }}

<footer class="site-foot">
  <div class="shell site-foot__row">
    <span>adrian.rossouw.ie</span>
    <span>typeset in Newsreader &amp; IBM Plex Mono</span>
